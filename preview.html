<!DOCTYPE html>
<html>
<body style="margin:0;">

<iframe id="frame" style="width:100%; height:100vh; border:none;"></iframe>

<script>
const projects = JSON.parse(localStorage.getItem("projects")) || [];
const index = localStorage.getItem("currentProject");

if (projects.length && index !== null) {
  document.getElementById("frame").srcdoc = projects[index].html;
} else {
  document.body.innerHTML = "<h2>No Preview Available</h2>";
}
</script>

</body>
</html>
